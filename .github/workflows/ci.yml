name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Offline validation
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.8.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check generated D1 migration
        run: |
          pnpm run db:generate
          git diff --exit-code -- migrations shared/db/schema.ts

      - name: Run unit tests
        run: pnpm run test:unit

      - name: Run integration and offline E2E tests
        run: pnpm run test:integration

      - name: Build app
        run: pnpm run build

      - name: Build indexer Worker
        run: pnpm exec wrangler deploy --config wrangler.indexer.jsonc --dry-run --outdir .wrangler/tmp-indexer-build
